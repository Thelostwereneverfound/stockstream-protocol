[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
rh_mainnet = "https://rpc.mainnet.chain.robinhood.com"
rh_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
rh_testnet = { key = "empty", url = "https://explorer.testnet.chain.robinhood.com/api/" }
rh_mainnet = { key = "empty", url = "https://robinhoodchain.blockscout.com/api/" }